      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Cap Body -->
  <path d="M 20,95 L 20,30 C 20,10 38,5 60,5 C 82,5 100,10 100,30 L 100,95 Z" fill="#165DFC" filter="url(#cap-glow)"/>
  
