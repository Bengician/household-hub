<svg width="120" height="220" viewBox="0 0 120 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Marker Shadow -->
  <filter id="body-shadow" x="-20%" y="-10%" width="140%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
  </filter>

  <!-- Exposed Felt Tip (Visible when cap pops) -->
  <path d="M 54,22 C 54,12 66,12 66,22 L 70,36 L 50,36 Z" fill="#1E293B"/>

  <!-- Nib Base Collar -->
  <rect x="44" y="36" width="32" height="10" rx="2" fill="#94A3B8"/>

  <!-- Main White Barrel -->
  <rect x="20" y="44" width="80" height="145" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#body-shadow)"/>

  <!-- Microphone Icon in Barrel Center -->
  <g transform="translate(60, 115)" stroke="#64748B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Capsule -->
    <rect x="-7" y="-14" width="14" height="20" rx="7"/>
    <!-- U-Bracket -->
    <path d="M -13,-2 C -13,9 13,9 13,-2"/>
    <!-- Stand -->
    <line x1="0" y1="9" x2="0" y2="16"/>
    <line x1="-7" y1="16" x2="7" y2="16"/>
  </g>

  <!-- Bottom Blue Plug -->
  <path d="M 22,175 L 98,175 L 98,180 C 98,188 90,195 80,195 L 40,195 C 30,195 22,188 22,180 Z" fill="#165DFC"/>
</svg>
